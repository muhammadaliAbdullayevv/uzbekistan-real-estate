# Live nginx config for rentals.ai-student-helper.site on the VPS.
# Source of truth is /etc/nginx/sites-available/uzbekistan-rentals on the
# server -- this is a tracked copy for reference/reprovisioning, not
# auto-deployed. Update it manually here when the live config changes.
#
# The /uploads/ location is served directly by nginx from disk rather than
# proxied to Next.js: next start does not reliably serve files added to
# public/ after the process has already started (confirmed -- a fresh
# upload 404'd until the app was restarted), so routing it through the app
# would make every real upload briefly (or indefinitely, between deploys)
# unreachable. Serving it as a static nginx location sidesteps that
# entirely and is also just more efficient for static file serving.

server {
    listen 80;
    server_name rentals.ai-student-helper.site;
    client_max_body_size 12m;

    location /uploads/ {
        alias /opt/uzbekistan-rentals/public/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name rentals.ai-student-helper.site;
    client_max_body_size 12m;
    ssl_certificate /etc/letsencrypt/live/rentals.ai-student-helper.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rentals.ai-student-helper.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /uploads/ {
        alias /opt/uzbekistan-rentals/public/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
