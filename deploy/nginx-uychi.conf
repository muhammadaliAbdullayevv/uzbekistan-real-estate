# Live nginx config for uychi.site on the VPS.
# Source of truth is /etc/nginx/sites-available/uychi on the server -- this
# is a tracked copy for reference/reprovisioning, not auto-deployed. Update
# it manually here when the live config changes.
#
# No SSL block here: this domain's TLS is terminated by DatabaseMart's own
# gateway (the VPS provider), which forwards plain HTTP to the port-80
# block below -- there's no cert or 443 listener for this domain on the
# VPS itself. This differs from how the previous domain
# (rentals.ai-student-helper.site, now decommissioned) was set up, which
# had nginx terminate TLS directly with its own Let's Encrypt cert.
#
# The /uploads/ location is served directly by nginx from disk rather than
# proxied to Next.js: next start does not reliably serve files added to
# public/ after the process has already started (confirmed -- a fresh
# upload 404'd until the app was restarted), so routing it through the app
# would make every real upload briefly (or indefinitely, between deploys)
# unreachable. Serving it as a static nginx location sidesteps that
# entirely and is also just more efficient for static file serving.
#
# /api/ai-uychi gets its own location with a longer proxy_read_timeout:
# nginx's 60s default is too short for it specifically -- a real request
# hit this and came back as a 504 HTML page instead of a JSON response
# (confirmed in nginx's access log). A multi-round AI conversation with
# Gemini model fallbacks can legitimately take longer than that. Every
# other route keeps the default 60s so a real backend hang elsewhere still
# fails fast instead of being masked.
#
# www.uychi.site redirects to the bare domain -- this block existing at all
# fixes a real bug, not just SEO tidiness: before it was added, a request
# for www.uychi.site had no matching server_name here, so it fell through to
# whatever nginx picked as a default and (combined with something on
# DatabaseMart's gateway side routing www.uychi.site to the wrong backend
# entirely) served a totally unrelated project's frontend instead of Uychi.
# Confirmed via curl: www.uychi.site/sitemap.xml was returning that other
# project's index.html with content-type text/html, which is also why
# Google Search Console kept rejecting the sitemap submission.

server {
    listen 80;
    server_name www.uychi.site;
    return 301 https://uychi.site$request_uri;
}

server {
    listen 80;
    server_name uychi.site;
    client_max_body_size 12m;

    location /uploads/ {
        alias /opt/uzbekistan-rentals/public/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ai-uychi {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
